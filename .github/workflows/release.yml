name: Release

# On every push to main, release-please keeps a release PR up to date from the
# Conventional Commits since the last release. Merging that PR tags vX.Y.Z,
# creates the GitHub Release, the publish job attaches the plugin zip, and the
# sync-dev job brings the release commit back to dev with a self-merging PR.
# It uses RELEASE_PLEASE_TOKEN (a fine-grained token with Contents and Pull
# requests write access) instead of GITHUB_TOKEN: pull requests opened with
# GITHUB_TOKEN do not trigger CI, and main and dev require CI to merge.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # releases are cut from main, whatever the default branch is
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Build the plugin zip
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: sh scripts/t4l-package.sh --ref "$TAG" --expect "$TAG"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/t4l-*.zip --clobber --repo "$GITHUB_REPOSITORY"

  # The release commit (version bump and changelog) lands on main only. Bring
  # it back to dev through a PR that merges itself once CI is green, so dev
  # stays the most up-to-date branch. A merge commit, never squash or rebase:
  # main must stay an ancestor of dev.
  sync-dev:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Open the main -> dev PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -eu
          repo=$GITHUB_REPOSITORY
          pr=$(gh pr list --repo "$repo" --base dev --head main --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            ahead=$(gh api "repos/$repo/compare/dev...main" -q .ahead_by)
            if [ "$ahead" -eq 0 ]; then
              echo "dev already contains main"
              exit 0
            fi
            gh pr create --repo "$repo" --base dev --head main \
              --title "chore: sync dev with main after $TAG" \
              --body "Brings the $TAG release commit (version bump and changelog) back into dev. Opened by the release workflow; it merges itself once CI is green."
            pr=$(gh pr list --repo "$repo" --base dev --head main --state open --json number -q '.[0].number')
          fi
          gh pr merge "$pr" --repo "$repo" --auto --merge
